<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penghitung WR MLBB</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top left, rgba(255, 51, 51, 0.12), transparent 25%),
        radial-gradient(circle at top right, rgba(255, 0, 0, 0.08), transparent 18%),
        linear-gradient(180deg, #090202 0%, #120406 100%);
      color: #eef2ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, rgba(24, 8, 8, 0.97), rgba(16, 3, 3, 0.98));
      border: 1px solid rgba(255, 56, 56, 0.18);
      border-radius: 24px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .hero {
      position: relative;
      padding: 32px 24px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 69, 69, 0.14), transparent);
      border-bottom: 1px solid rgba(248, 113, 113, 0.18);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 0.02em;
    }

    .hero p {
      margin: 0;
      color: #a5b4fc;
    }

    .follow-banner {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      animation: pulse 2.4s infinite ease-in-out;
      border: 1px solid rgba(248, 99, 99, 0.25);
      font-size: 0.95rem;
    }

    .follow-ball {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.8);
      animation: float 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .hero-banner-bg {
      width: 100%;
      height: 100px;
      margin: 18px auto 0;
      border-radius: 18px;
      background: url('banner.png') center/cover no-repeat;
      background-position: center center;
      box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.18), 0 18px 48px rgba(0, 0, 0, 0.36);
      position: relative;
      overflow: hidden;
    }

    .hero-banner-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 35%, rgba(7, 11, 20, 0.55) 100%);
    }

    .content {
      padding: 24px;
    }

    .input-group {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      display: inline-block;
    }

    input[type='number'] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(15, 23, 42, 0.95);
      color: #eff6ff;
      font-size: 1rem;
      outline: none;
    }

    input[type='number']::placeholder {
      color: #cbd5e1;
    }

    input[type='number']:focus {
      border-color: rgba(248, 113, 113, 0.8);
      box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.1);
    }

    .button-row {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(56, 189, 248, 0.18);
    }

    .primary {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 16px 30px rgba(239, 68, 68, 0.28);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      border: 1px solid rgba(248, 113, 113, 0.18);
    }

    .result-box {
      margin-top: 22px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(15, 8, 8, 0.94);
      border: 1px solid rgba(248, 113, 113, 0.18);
      color: #e2e8f0;
      min-height: 82px;
    }

    .result-box strong {
      display: block;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .result-line {
      margin: 6px 0;
      font-size: 0.98rem;
    }

    .social-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .social-link {
      width: 64px;
      height: 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(0,0,0,0.25), rgba(255,255,255,0.02));
      border: 1px solid rgba(255, 56, 56, 0.14);
      text-decoration: none;
      color: #fff;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .social-link:hover {
      background: linear-gradient(135deg, rgba(239,68,68,0.16), rgba(255,255,255,0.02));
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 14px 36px rgba(239,68,68,0.18);
    }

    .social-icon {
      width: 28px;
      height: 28px;
      display: block;
      color: currentColor;
      filter: none;
    }

    .small-text {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-top: 2px;
    }
    
    /* Platform-specific social button colors */
    .social-link.tiktok {
      background: #080808;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      overflow: visible;
      box-shadow: inset 0 -6px 18px rgba(0,0,0,0.65), 0 10px 30px rgba(0,0,0,0.6);
      border-radius: 14px;
    }
    .social-link.tiktok::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 10px;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.04), rgba(255,255,255,0) 50%);
      pointer-events: none;
    }
    .social-link.tiktok::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(105,201,208,0.06), 0 6px 18px rgba(238,29,82,0.04) inset;
      pointer-events: none;
    }
    .social-link.tiktok .social-icon {
      width: 36px;
      height: 36px;
      z-index: 1;
      display: block;
    }
    .social-link.tiktok img.social-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      display: block;
      border-radius: 6px;
    }
    .social-link.wa { background: linear-gradient(135deg,#25D366 0%, #128C7E 100%); color: #fff; border-color: rgba(0,0,0,0.12); }
    .social-link.fb { background: linear-gradient(135deg,#1877F2 0%, #0D47A1 100%); color: #fff; border-color: rgba(0,0,0,0.12); }
    .social-link.ig { background: radial-gradient(circle at 30% 20%, #fccc63 0%, #f58529 25%, #dd2a7b 50%, #8134af 75%, #515bd4 100%); color: #fff; border-color: rgba(0,0,0,0.12); }

    .social-link.tiktok:hover { box-shadow: 0 18px 40px rgba(0,0,0,0.35); }
    .social-link.wa:hover { box-shadow: 0 18px 40px rgba(18,140,126,0.28); }
    .social-link.fb:hover { box-shadow: 0 18px 40px rgba(13,71,161,0.28); }
    @media (max-width: 420px) {
      .hero-banner-bg { height: 70px; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <div class="follow-banner">
        <span class="follow-ball"></span>
        <span>Follow TikTok <strong>ZackkG5</strong></span>
      </div>
      <h1>Selamat datang</h1>
      <p>Web hitung WR MLBB dan perkiraan kemenangan</p>
      <div class="hero-banner-bg"></div>
    </div>
    <div class="content">
      <div class="input-group">
        <label for="totalMatch">Total match anda</label>
        <input id="totalMatch" type="number" min="0" placeholder="Cth: 250" />
      </div>
      <div class="input-group">
        <label for="totalWr">Total WR Anda </label>
        <input id="totalWr" type="number" min="0" max="100" placeholder="Cth: 70" />
      </div>
      <div class="input-group">
        <label for="desiredWr">Berapa WR yang anda inginkan</label>
        <input id="desiredWr" type="number" min="0" max="100" placeholder="Cth: 80" />
      </div>

      <div class="button-row">
        <button class="primary" id="calculateBtn">Hasil</button>
      </div>

      <div class="result-box" id="resultBox">
        <strong>Hasil perhitungan akan muncul di sini.</strong>
        <div class="result-line" id="matchResult"></div>
        <div class="result-line" id="winLoseResult"></div>
      </div>

      <div class="social-row">
        <a class="social-link tiktok" href="https://www.tiktok.com/@zackkg5?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener noreferrer" title="TikTok">
          <img src="TIktok.jpeg" alt="TikTok" class="social-img" />
        </a>
        <a class="social-link wa" href="https://wa.me/6285177362478" target="_blank" rel="noopener noreferrer" title="WhatsApp">
          <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M17.472 14.382c-.297-.148-1.758-.867-2.03-.967-.273-.099-.472-.148-.672.149-.2.297-.772.967-.946 1.164-.174.198-.348.223-.645.074-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.654-2.059-.174-.297-.019-.458.13-.606.134-.133.297-.347.446-.52.15-.174.199-.298.299-.497.099-.198.05-.372-.025-.52-.074-.149-.672-1.618-.921-2.214-.242-.583-.487-.504-.672-.514l-.573-.01c-.2 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.064 2.876 1.213 3.074c.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.693.626.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.174-1.414-.074-.124-.272-.198-.57-.347m-5.421 7.019h-.001a9.87 9.87 0 0 1-5.032-1.379l-.361-.214-3.71.974.993-3.612-.235-.37A9.864 9.864 0 0 1 2.25 11.987C2.25 6.63 6.628 2.25 12 2.25c3.196 0 6.06 1.25 8.25 3.506a11.554 11.554 0 0 1 2.997 8.247c0 5.36-4.378 9.742-9.746 9.742m8.413-18.35A11.815 11.815 0 0 0 12 0C5.373 0 0 5.374 0 12c0 2.116.553 4.156 1.606 5.958L0 24l6.304-1.655A11.935 11.935 0 0 0 12 24c6.627 0 12-5.374 12-12 0-3.202-1.248-6.206-3.514-8.274"/></svg>
        </a>
        <a class="social-link fb" href="https://web.facebook.com/photo/?fbid=1597062390923819&_rdc=1&_rdr#" target="_blank" rel="noopener noreferrer" title="Facebook">
          <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M22.675 0H1.325C.593 0 0 .593 0 1.326v21.348C0 23.407.593 24 1.325 24H12.82V14.706h-3.012V11.08h3.012V8.41c0-2.982 1.823-4.604 4.486-4.604 1.276 0 2.372.095 2.693.138v3.123l-1.848.001c-1.449 0-1.729.689-1.729 1.699v2.228h3.458l-.451 3.626h-3.007V24h5.897C23.406 24 24 23.407 24 22.674V1.326C24 .593 23.406 0 22.675 0"/></svg>
        </a>
        <a class="social-link ig" href="https://www.instagram.com/zackk6s/" target="_blank" rel="noopener noreferrer" title="Instagram">
          <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm8.5 4.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    const totalMatchInput = document.getElementById('totalMatch');
    const totalWrInput = document.getElementById('totalWr');
    const desiredWrInput = document.getElementById('desiredWr');
    const calculateBtn = document.getElementById('calculateBtn');
    const matchResult = document.getElementById('matchResult');
    const winLoseResult = document.getElementById('winLoseResult');

    function formatNumber(value) {
      return Number(value).toLocaleString('id-ID');
    }

    function showResult(message) {
      matchResult.textContent = message;
    }

    function showWinLose(message) {
      winLoseResult.textContent = message;
    }

    function calculateRequiredWins() {
      const totalMatch = Number(totalMatchInput.value);
      const totalWr = Number(totalWrInput.value);
      const desiredWr = Number(desiredWrInput.value);

      if (isNaN(totalMatch) || isNaN(totalWr) || isNaN(desiredWr)) {
        showResult('Isi semua kolom dengan angka yang valid.');
        return;
      }

      if (totalMatch <= 0) {
        showResult('Total match harus lebih dari 0.');
        return;
      }

      if (totalWr < 0 || totalWr > 100 || desiredWr < 0 || desiredWr > 100) {
        showResult('WR harus berada di antara 0 dan 100.');
        return;
      }

      const currentWins = Math.round((totalWr / 100) * totalMatch);
      const neededWins = Math.ceil(((desiredWr / 100) * totalMatch - currentWins) / (1 - desiredWr / 100));
      const targetWins = Math.max(0, neededWins);
      const finalApproxWr = ((currentWins + targetWins) / (totalMatch + targetWins)) * 100;

      if (desiredWr <= totalWr) {
        showResult('Target WR sudah Tercapai');
        showWinLose(`${finalApproxWr.toFixed(2)}% WR Hasil`);
      } else if (isFinite(targetWins)) {
        showResult(`${formatNumber(targetWins)} Pertandingan Lagi untuk capai ${desiredWr}% `);
        showWinLose(`${finalApproxWr.toFixed(2)}% WR Hasil`);
      } else {
        showResult('Tidak bisa capai target');
        showWinLose('');
      }
    }

    calculateBtn.addEventListener('click', calculateRequiredWins);
  </script>
</body>
</html>
